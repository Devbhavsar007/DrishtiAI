version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: drishtiai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_SECRET_KEY=sih2026-production-drishtiai-key
      - FLASK_SECRET=sih2026-production-drishtiai-key
      - OFFLINE_MODE=True
      - DEBUG=False
    volumes:
      - ./DrishtiAI.db:/app/DrishtiAI.db
      - ./uploads:/app/uploads
      - ./results:/app/results
    networks:
      - drishti-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: drishtiai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - drishti-network

networks:
  drishti-network:
    driver: bridge
