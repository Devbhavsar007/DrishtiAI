    <!-- CRITICAL: Nuke stale SW caches immediately before any fetch can be intercepted.
         This runs BLOCKING in <head> so the old SW can't serve stale assets. -->
    <script>
      (function() {
        var SW_VERSION = 'v3';
        var lastVersion = localStorage.getItem('drishti_sw_ver');
        if (lastVersion !== SW_VERSION && 'serviceWorker' in navigator) {
          // Version mismatch — purge everything
          localStorage.setItem('drishti_sw_ver', SW_VERSION);
          // Unregister all service workers
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            var didUnregister = false;
            regs.forEach(function(reg) { reg.unregister(); didUnregister = true; });
            // Purge all caches
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(key) { caches.delete(key); });
              });
            }
            // If we actually unregistered an old SW, hard-reload to get fresh content
            if (didUnregister) {
              console.log('[DrishtiAI] Purged stale SW — reloading fresh');
              location.reload();
            }
          });
        }
      })();
    </script>
  </head>

        <div style="font-family:Inter,system-ui,sans-serif;font-size:11px;font-weight:600;color:rgba(255,255,255,0.35);letter-spacing:0.12em;text-transform:uppercase;">Loading DrishtiAI</div>

      <style>

    <!-- Service Worker Registration with Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('[DrishtiAI] SW registered:', reg.scope);
              // Check for updates every 60s
              setInterval(() => reg.update(), 60000);
              // When a new SW takes over, reload for fresh assets
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                      console.log('[DrishtiAI] New SW activated — reloading for fresh assets');
                      window.location.reload();
                    }
                  });
                }
              });
            },
            (err) => console.warn('[DrishtiAI] SW registration failed:', err)
          );
        });
      }
    </script>
