<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO & Identity -->
    <title>DrishtiAI — Accessible Medical AI Retinal Screening (WCAG 2.2 AAA)</title>
    <meta name="description" content="Accessible clinical-grade medical AI dashboard for Diabetic Retinopathy screening with Gemma-4 intelligence, Grad-CAM heatmaps, and low-vision ergonomics." />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E54B7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DrishtiAI" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="DrishtiAI" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased bg-[#0B0F19] text-[#F8FAFC]">
    <div id="root">
      <!-- Inline loader: visible only until React mounts and replaces this content -->
      <div id="app-loader" style="display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh;gap:16px;">
        <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.15);border-top-color:#619FE8;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <div style="font-family:Inter,system-ui,sans-serif;font-size:13px;font-weight:600;color:rgba(255,255,255,0.5);letter-spacing:0.05em;">LOADING DRISHTIAI</div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration with Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => {
              console.log('[DrishtiAI] SW registered:', reg.scope);
              // Check for updates every 60s
              setInterval(() => reg.update(), 60000);
              // When a new SW takes over, reload for fresh assets
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                      console.log('[DrishtiAI] New SW activated — reloading for fresh assets');
                      window.location.reload();
                    }
                  });
                }
              });
            },
            (err) => console.warn('[DrishtiAI] SW registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
