services:
  - type: web
    name: DrishtiAI-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_SECRET
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: GEMMA_API_KEY_1
        sync: false
